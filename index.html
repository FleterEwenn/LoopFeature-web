<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>loopfeature-web</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,200..800;1,200..800&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">   

</head>
<body>
    <h1>LoopFeature</h1>
    <div id="map"></div>
    <br/>
    <form id="form">
        <input required id="loop-distance" type="number" step="1" min="1" max="200" placeholder="Distance (km)"> 
        <button id="submit-btn" type="submit">Générer</button>
    </form>
    <div id="download">
        <div id="container">
            <div class="loader" id="loader1"></div>
            <div class="loader" id="loader2"></div>
            <div class="loader"id="loader3"></div>
        </div>
        <!--<button id="btnDownload">Télécharger le fichier GPX</button>-->
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
<br/>
</html>
